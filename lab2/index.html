<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Building Permits Vancouver, BC</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.35.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: fixed;
            top: 0vh;
            bottom: 0;
            width: 100%;
        }

        #overlay {
            position: fixed;
            top: 5vh;
            left: 0;
            width: 100%;
            height: 95vh;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            z-index: 2;
            display: flex;
            left: 0 ;
            right: 0;
            bottom: 10vh;
            align-items: center;
            width: 65vw;
            margin: 0 auto;
            padding: .5rem .75rem;
            /*added some background so the slide wasnt floating*/
            box-sizing: border-box;
            border: 2px solid rgb(96 139 168);
            border-radius: 5px;
            background-color: rgb(96 139 168 / 0.2);
        }

        #controls input[type=range] {
            flex: 1;
        }

        #title {
            position: fixed;
            top: 5vh;
            left: 10px;
            padding: .4rem .75rem;
            font: bold 1.1rem sans-serif;
            border: 2px solid rgb(96 139 168);
            border-radius: 5px;
            background-color: rgb(255 255 255 / 0.85);
            z-index: 1;
        }

        #legend {
            position: fixed;
            bottom: 40px;
            left: 10px;
            padding: .5rem .75rem;
            font: 13px sans-serif;
            border: 2px solid rgb(96 139 168);
            border-radius: 5px;
            background-color: rgb(255 255 255 / 0.85);
            z-index: 1;
        }

        #legend div {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin: .2rem 0;
        }

        .permits {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .permits.soFar {
            border: 1px solid black;
            /* matches the hollow black circles */
        }

        .permits.firstOne {
            background-color: blue;
            /* matches the first-permit dot */
        }
    </style>
</head>

<body>
    <div id="title">Muti-Story Building Permits timeline in Vancouver, BC</div>
    <div id="controls">
        <button id="iniciate">Start</button>
        <input id="slide" type="range" min="0" value="0" step="1">
        <output id="label"></output>
    </div>
    <div id="legend">
        <div><span class="permits soFar"></span> Building permit issued (up to now)</div>
        <div><span class="permits firstOne "></span> First permit issued</div>
    </div>
    <div id="map"></div>
    <svg id="overlay"></svg>

    <script src="map.js"></script>

</body>

</html>
