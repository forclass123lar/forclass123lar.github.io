<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>eGRID fuel mix</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 10px; left: 10px; background: #fff; padding: 10px; width: 200px; }
    #bar { height: 12px; margin-top: 8px; background: linear-gradient(to right, #2166ac, #f7f7f7, #b2182b); }
    #ticks { display: flex; justify-content: space-between; font-size: 11px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <b>Share of net generation</b>
    <select id="fuel"></select>
    <div id="bar"></div>
    <div id="ticks"><span>0%</span><span>50%</span><span>100%</span></div>
  </div>

  <script>
    var LAYER = 'joined_layer_egrid';

    var map = new maplibregl.Map({
      container: 'map',
      style: 'joined_info_style.json',
      center: [-98, 39],
      zoom: 3.5
    });

    var select = document.getElementById('fuel');

    // Color the polygons by the selected fuel column
    function colorMap() {
      map.setPaintProperty(LAYER, 'fill-color', [
        'interpolate', ['linear'], ['get', select.value],
        0, '#2166ac',
        50, '#f7f7f7',
        100, '#b2182b'
      ]);
    }

    map.on('load', function () {
      var url = map.getSource(LAYER).serialize().data;

      Promise.all([
        fetch(url).then(r => r.json()),
        fetch('egrid_fuel_mix.csv').then(r => r.text())
      ]).then(function (results) {
        var geojson = results[0];
        var rows = results[1].trim().split('\n').map(line => line.split(','));
        var header = rows[0].map(h => h.trim());   // Subregion, Coal, Oil, ...

        // Add each fuel column to the dropdown
        header.slice(1).forEach(h => select.add(new Option(h)));

        // Build one clean set of properties per subregion from the CSV
        var data = {};
        rows.slice(1).forEach(function (row) {
          var props = { Subregion: row[0].trim() };
          header.slice(1).forEach((h, i) => props[h] = parseFloat(row[i + 1]));
          data[props.Subregion] = props;
        });

        // Keep only the shapes from the geojson; every property comes from the CSV
        geojson.features.forEach(f => f.properties = data[f.properties.Subregion] || {});

        map.getSource(LAYER).setData(geojson);
        colorMap();
      });
    });

    select.addEventListener('change', colorMap);

    // Click a region to list its fuel shares (all values come from the CSV)
    map.on('click', LAYER, function (e) {
      var p = e.features[0].properties;
      var html = '<b>' + p.Subregion + '</b>' +
        Object.keys(p).filter(k => k !== 'Subregion').map(k => '<br>' + k + ': ' + p[k] + '%').join('');
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
    });
  </script>
</body>
</html>
